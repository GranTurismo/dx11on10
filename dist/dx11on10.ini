; dx11on10: runs DirectX 11 games on DirectX 10 graphics cards.
; Put d3d11.dll (32-bit or 64-bit, matching the game) and this file next to the game's .exe.
[dx11on10]
; Highest feature level of the real device: 10_1, 10_0, or native (no limit, for comparisons)
MaxFeatureLevel=10_1
; Tell DX11-only games they got feature level 11_0: auto (only when needed), always, off
FakeFeatureLevel=auto
; 0 = only limit the feature level and change nothing else (behaves like a plain DX10 card)
Translate=1
; hardware, or warp (Microsoft's software renderer: slow, for testing)
Driver=hardware
; 1 = D3D debug layer on, its warnings go to dx11on10.log (needs Windows "Graphics Tools")
DebugLayer=0
; 1 = save every shader, original and converted, into dx11on10_shaders
DumpShaders=0
; Save screenshots of these frames, e.g. 100,500
Screenshots=
; Quit after this frame (automated tests); 0 = never
ExitAfterFrame=0
